<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NilaiKita — Penilaian Jawaban Esai</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0d0d12;color:#f5f5f7}
.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#171720;border:1px solid #2b2b36;border-radius:18px;padding:18px;margin:14px 0}
h1{margin:0 0 6px;font-size:28px}.muted{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-weight:700;margin-bottom:6px}select,input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #393945;background:#101017;color:white}
button{cursor:pointer;font-weight:700}button.primary{background:#6d43d8;border:0}button:disabled{opacity:.5;cursor:not-allowed}
.drop{border:2px dashed #44445a;padding:25px;text-align:center;border-radius:14px}
.status{padding:10px;border-radius:10px;background:#101017;margin-top:10px}
.progress{height:8px;background:#292933;border-radius:8px;overflow:hidden}.bar{height:100%;width:0;background:#8b67e8;transition:.2s}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #30303a;text-align:left;vertical-align:top}
.score{font-size:24px;font-weight:800}.ok{color:#7ee787}.warn{color:#ffd166}
.small{font-size:13px;color:#aaa}.answer{white-space:pre-wrap;max-height:180px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>NilaiKita — FULL LOCAL</h1>
    <div class="muted">Pembacaan tulisan tangan dan penilaian berjalan di browser. Tidak memakai API key.</div>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label for="subject">Mata Pelajaran</label>
        <select id="subject">
          <option value="X">X — Seni Rupa</option>
          <option value="XI">XI — Seni Tari</option>
          <option value="XII">XII — Seni Musik</option>
        </select>
      </div>
      <div>
        <label for="files">Lembar Jawaban</label>
        <input id="files" type="file" accept="image/*" multiple>
      </div>
    </div>
    <div class="drop" id="drop">Pilih atau seret beberapa foto lembar jawaban ke sini.</div>
    <div style="height:12px"></div>
    <button class="primary" id="start">Mulai Baca & Nilai</button>
    <div class="status" id="status">Belum dimulai.</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <div class="card">
    <button id="csv" disabled>Ekspor CSV</button>
    <div id="results"></div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
